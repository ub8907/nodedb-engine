[package]
name = "minidb-rs"
version = "0.1.0"
edition = "2021"
authors = ["NodeDB Team"]
description = "Ultra-low memory embedded single-file database engine with on-disk index and C ABI for multi-language bindings"
license = "MIT OR Apache-2.0"

[lib]
name = "minidb"
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "minidb-cli"
path = "src/main.rs"

[dependencies]
flate2 = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crc32fast = "1.4"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = false
